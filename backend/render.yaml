services:
  - type: web
    name: hoot-path-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    # ⚠️  Do NOT store real credentials here.
    # Set all values below in the Render Dashboard → Environment.
    envVars:
      - key: MONGO_URI
        sync: false       # MongoDB Atlas URI — set in Render Dashboard
      - key: OPENROUTER_KEYS
        sync: false       # Comma-separated OpenRouter API keys — set in Render Dashboard
      - key: OPENROUTER_MODELS
        sync: false       # (Optional) Override free model list — set in Render Dashboard
      - key: PORT
        value: 5001
