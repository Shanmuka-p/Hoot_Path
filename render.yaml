services:
  - type: web
    name: hoot-path-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    # ⚠️  Do NOT store real credentials here.
    # Set MONGO_URI and PORT in the Render dashboard under Environment → Secret Files.
    # This file only documents which keys the service needs.
    envVars:
      - key: MONGO_URI
        sync: false       # Set the actual value in Render Dashboard → Environment
      - key: PORT
        value: 5001
